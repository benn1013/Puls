<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Puls</title>
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --text-dark: #f4f4f5;
            --text-light: #a1a1aa;
            --accent-spicy: #e11d48;
            --accent-soft: #4c1d95;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --transition-speed: 0.25s;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; padding-bottom: 90px; }
        
        header { background-color: var(--card-bg); padding: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #27272a; display: flex; align-items: center; justify-content: space-between; }
        h1 { font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; color: var(--accent-spicy); text-transform: uppercase; }
        
        .role-badge { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 800; text-transform: uppercase; background: #27272a; color: var(--text-dark); }
        .role-active-benni { background: #1e3a8a; color: #93c5fd; }
        .role-active-sarah { background: #581c87; color: #f3e8ff; }

        .container { max-width: 440px; margin: 12px auto; padding: 0 16px; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background: #27272a; border-radius: 10px; margin-bottom: 6px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--accent-spicy); width: 0%; transition: width 0.4s ease; }

        /* Swipe Card System */
        .swipe-container { position: relative; height: 320px; margin-bottom: 16px; margin-top: 10px; }
        .swipe-card { position: absolute; width: 100%; height: 100%; background: var(--card-bg); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid #27272a; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card-cat { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent-spicy); font-weight: 800; margin-bottom: 14px; background: #2e1018; padding: 4px 12px; border-radius: 20px; }
        .card-text { font-size: 1.1rem; font-weight: 700; line-height: 1.4; flex-grow: 1; display: flex; align-items: center; justify-content: center; color: var(--text-dark); }
        
        .swipe-buttons { display: flex; gap: 10px; margin-bottom: 20px; }
        .swipe-btn { flex: 1; border: none; padding: 14px; border-radius: 16px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: white; transition: transform 0.1s; }
        .swipe-btn:active { transform: scale(0.95); }
        .btn-no { background-color: var(--danger-color); }
        .btn-maybe { background-color: var(--warning-color); color: #09090b; }
        .btn-yes { background-color: var(--success-color); }

        /* Level Selector List */
        .level-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .level-btn { background: var(--card-bg); border: 1px solid #27272a; color: var(--text-light); padding: 10px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-align: center; line-height: 1.2; }
        .level-btn.active { background: var(--accent-soft); border-color: var(--accent-spicy); color: white; }

        /* Result Items */
        .result-title { font-size: 0.85rem; font-weight: 800; margin: 20px 0 10px 4px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-light); }
        .item-list { list-style: none; }
        .item-list li { background: var(--card-bg); padding: 14px 16px; border-radius: 16px; margin-bottom: 8px; font-size: 0.92rem; font-weight: 600; border-left: 4px solid transparent; line-height: 1.4; color: var(--text-dark); }
        .match-hot li { border-left-color: var(--success-color); }
        .match-talk li { border-left-color: var(--warning-color); }
        .empty-state { color: var(--text-light); font-style: italic; font-size: 0.85rem; border-left: none !important; padding: 10px 4px; background: transparent !important; }

        /* Timer Widget */
        #timer-display { font-size: 2.5rem; font-weight: 800; color: var(--accent-spicy); margin: 14px 0; text-align: center; font-family: monospace; display: none; }

        /* Action Blocks */
        .dashboard-box { background: var(--card-bg); padding: 18px; border-radius: 24px; border: 1px solid #27272a; margin-bottom: 14px; }
        .btn-block { width: 100%; border: none; padding: 14px; border-radius: 16px; font-size: 0.95rem; font-weight: 700; color: white; cursor: pointer; margin-top: 8px; }
        .btn-primary { background: var(--accent-spicy); }
        .btn-secondary { background: #27272a; }

        /* Sync Panel */
        .sync-panel-card { background: rgba(16, 185, 129, 0.05); padding: 20px; border-radius: 24px; text-align: center; border: 1px solid var(--success-color); margin-top: 15px; }

        /* Navigation Bar */
        .mode-tabs { display: flex; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(20px); position: fixed; bottom: 0; left: 0; width: 100%; height: 68px; border-top: 1px solid #27272a; z-index: 100; }
        .tab-btn { flex: 1; border: none; background: none; color: var(--text-light); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; font-weight: 700; gap: 4px; }
        .tab-btn span.icon { font-size: 1.2rem; }
        .tab-btn.active { color: var(--accent-spicy); }

        .toast { position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%); background: #f4f4f5; color: #09090b; padding: 10px 20px; border-radius: 30px; z-index: 1000; font-size: 0.85rem; font-weight: 700; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body>

    <header>
        <h1>Puls</h1>
        <div id="active-role-badge" class="role-badge">Lade...</div>
    </header>

    <div class="container">
        
        <section id="section-swipe" class="view-section active">
            <div class="progress-container"><div class="progress-bar" id="swipe-progress-bar"></div></div>
            <div id="swipe-stats-text" style="font-size:0.75rem; color:var(--text-light); text-align:center; margin-bottom:10px; font-weight:700;">0 / 0 Fantasien bewertet</div>
            
            <div class="swipe-container">
                <div class="swipe-card" id="active-card">
                    <div class="card-cat" id="card-cat-display">Laden...</div>
                    <div class="card-text" id="card-text-display">Verbindung wird aufgebaut...</div>
                </div>
            </div>
            
            <div class="swipe-buttons">
                <button class="swipe-btn btn-no" onclick="handleSwipe('NEIN')">No-Go! ❌</button>
                <button class="swipe-btn btn-maybe" onclick="handleSwipe('VIELLEICHT')">Reden... 💬</button>
                <button class="swipe-btn btn-yes" onclick="handleSwipe('JA')">Sofort! 🔥</button>
            </div>

            <div class="dashboard-box" style="margin-top: 30px; border-left: 3px solid var(--accent-spicy);">
                <div style="font-size:0.9rem; font-weight:800; color:var(--accent-spicy); margin-bottom:8px;">🥷🏽 Geheime Fantasie-Schmiede</div>
                <p style="font-size:0.75rem; color:var(--text-light); margin-bottom:12px; line-height: 1.4;">
                    Schleuse heimlich eine eigene Fantasie ein. Dein <strong>"Sofort! 🔥"</strong> wird automatisch geloggt
